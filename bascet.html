<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик | MM2 shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

    <header>
<h1>Mm2 shop</h1>
<nav class="AI">
<a href="main.html">Main</a>
<a href="index.html">Shop</a>
<a href="bascet.html">Cart</a>
</nav>


    </header>
    <main class="cart-page">
        <section class="cart-section">
            <h2>Ваш кошик</h2>
            <div id="cart-items"></div>
            <div class="cart-summary">
                <strong>Разом: <span id="cart-total">$0</span></strong>
                <button type="button" id="order-btn" class="Date">Замовити</button>
            </div>
        </section>

        <form id="order-form" class="order-form" hidden>
            <h2>Оформлення замовлення</h2>
            <label for="customer-name">Ваше ім'я</label>
            <input type="text" id="customer-name" required>
            <label for="customer-email">Email</label>
            <input type="email" id="customer-email" required>
            <label for="customer-address">Адреса</label>
            <input type="text" id="customer-address" required>
            <label for="customer-phone">Телефон</label>
            <input type="tel" id="customer-phone" required>
            <button type="submit" class="Date">Підтвердити замовлення</button>
            <p id="order-message" role="status"></p>
        </form>
    </main>
    <footer>
       
    </footer>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
